name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build (warnings are errors)
        run: dotnet build MarkView.sln -c Release -warnaserror

      - name: Test
        run: dotnet test MarkView.sln -c Release --no-build
